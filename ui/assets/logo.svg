<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 560" role="img" aria-labelledby="title desc">
  <title id="title">miRNA mRNA Predictive Interaction Logo</title>
  <desc id="desc">A soft purple Material You style logo for miRNA and mRNA predictive interaction.</desc>
  <defs>
    <filter id="blur-large" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="blur-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4f378b" flood-opacity="0.24" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1c1b1f" flood-opacity="0.08" />
    </filter>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffbfe" />
      <stop offset="0.52" stop-color="#f7f2fa" />
      <stop offset="1" stop-color="#f2ecff" />
    </linearGradient>
    <linearGradient id="rna" x1="0.12" x2="0.9" y1="0.18" y2="0.86">
      <stop offset="0" stop-color="#d7c5f7" />
      <stop offset="0.45" stop-color="#6750a4" />
      <stop offset="1" stop-color="#4f378b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8def8" stop-opacity="0.96" />
      <stop offset="0.45" stop-color="#b69df8" stop-opacity="0.62" />
      <stop offset="1" stop-color="#6750a4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1024" height="560" fill="url(#bg)" />
  <circle cx="111" cy="72" r="138" fill="#4f378b" opacity="0.88" filter="url(#blur-soft)" />
  <circle cx="994" cy="520" r="156" fill="#7d5260" opacity="0.78" filter="url(#blur-large)" />
  <circle cx="730" cy="337" r="70" fill="#b69df8" opacity="0.48" filter="url(#blur-large)" />
  <circle cx="686" cy="105" r="58" fill="#7d5260" opacity="0.9" />
  <circle cx="331" cy="456" r="48" fill="#5f3f54" opacity="0.92" />
  <rect x="24" y="333" width="310" height="112" rx="56" fill="#e8def8" opacity="0.62" />
  <rect x="122" y="333" width="238" height="112" rx="56" fill="#8b777e" opacity="0.46" />
  <rect x="684" y="98" width="229" height="112" rx="56" fill="#6750a4" opacity="0.72" />

  <rect x="314" y="74" width="392" height="410" rx="106" fill="#fffbfe" opacity="0.95" filter="url(#card-shadow)" />
  <circle cx="532" cy="222" r="84" fill="url(#glow)" />
  <ellipse cx="533" cy="221" rx="36" ry="18" fill="#7d5260" opacity="0.56" filter="url(#blur-soft)" />
  <circle cx="461" cy="250" r="33" fill="#6750a4" opacity="0.42" filter="url(#blur-soft)" />
  <circle cx="608" cy="238" r="38" fill="#6750a4" opacity="0.5" filter="url(#blur-soft)" />

  <path
    d="M395 286 C432 218 477 257 511 263 C554 270 568 216 639 198"
    fill="none"
    stroke="url(#rna)"
    stroke-width="11"
    stroke-linecap="round"
  />
  <path
    d="M441 150 C476 141 471 196 505 193 C539 191 548 157 609 120"
    fill="none"
    stroke="#c7b8ec"
    stroke-width="9"
    stroke-linecap="round"
  />
  <path
    d="M471 219 C500 229 523 230 554 217 C575 207 590 188 611 170"
    fill="none"
    stroke="#4f378b"
    stroke-width="8"
    stroke-linecap="round"
    opacity="0.72"
  />

  <g stroke="#4f378b" stroke-linecap="round" stroke-width="6" opacity="0.82">
    <path d="M414 258 l-18 0" />
    <path d="M430 240 l-13 -13" />
    <path d="M452 232 l0 -20" />
    <path d="M477 244 l-4 -20" />
    <path d="M501 260 l6 -20" />
    <path d="M530 258 l7 -20" />
    <path d="M555 241 l17 -13" />
    <path d="M579 216 l20 0" />
  </g>
  <g stroke="#c7b8ec" stroke-linecap="round" stroke-width="6" opacity="0.9">
    <path d="M456 154 l-15 -7" />
    <path d="M466 169 l-17 0" />
    <path d="M478 187 l-13 12" />
    <path d="M532 188 l4 -20" />
    <path d="M553 170 l16 13" />
    <path d="M578 151 l16 13" />
  </g>

  <path d="M548 199 C546 173 561 145 587 127" fill="none" stroke="#7d5260" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M560 199 C560 171 577 149 602 136" fill="none" stroke="#7d5260" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M533 205 C543 184 546 162 537 141" fill="none" stroke="#7d5260" stroke-width="3" stroke-linecap="round" opacity="0.72" />
  <g fill="#7d5260" opacity="0.45">
    <circle cx="560" cy="135" r="2.2" />
    <circle cx="578" cy="119" r="2" />
    <circle cx="594" cy="142" r="2" />
    <circle cx="612" cy="132" r="2.3" />
    <circle cx="585" cy="158" r="2.4" />
    <circle cx="614" cy="164" r="2" />
    <circle cx="569" cy="177" r="2" />
  </g>

  <text x="512" y="385" text-anchor="middle" fill="#121014" font-family="Roboto, Arial, sans-serif" font-size="37" font-weight="700">miRNA • mRNA</text>
  <text x="512" y="420" text-anchor="middle" fill="#121014" font-family="Roboto, Arial, sans-serif" font-size="26" font-weight="500">Predictive Interaction</text>
</svg>
